(() => {
  'use strict';
  const required = (value, label) => {

  function assemble(common, parts) {
    if (common.schemaVersion !== 1) throw new Error('common.json의 schemaVersion은 1이어야 합니다.');

    if (!learning || !Number.isFinite(learning.defaultSpeechRate) || learning.defaultSpeechRate < 0.5 || learning.defaultSpeechRate > 2) throw new Error('기본 발음 속도는 0.5~2로 입력해 주세요.');
    if (!Number.isInteger(learning.quizOptionCount) || learning.quizOptionCount < 2 || learning.quizOptionCount > 4) throw new Error('객관식 보기 수는 2~4로 입력해 주세요.');
    new Intl.DateTimeFormat('ko-KR', {timeZone: learning.timezone});
    const screens = ['study', 'quiz', 'history', 'settings'];
    if (!Array.isArray(common.navigation) || common.navigation.length !== screens.length || new Set(common.navigation.map(n => n.id)).size !== screens.length) throw new Error('하단 메뉴는 study, quiz, history, settings를 각각 한 번씩 지정해 주세요.');
    common.navigation.forEach(n => {if (!screens.includes(n.id)) throw new Error(`알 수 없는 메뉴: ${n.id}`); required(n.label, '메뉴 이름');});
    if (!Array.isArray(common.departments) || !common.departments.length) throw new Error('학과 목록이 비어 있습니다.');
    const departmentIds = new Set(), filenames = new Set(), ids = new Set(), expressions = [];
    common.departments.forEach((d, i) => {
      required(d.id, '학과 ID'); required(d.name, `${d.id} 학과 이름`);
      if (departmentIds.has(d.id)) throw new Error(`중복 학과 ID: ${d.id}`);
      departmentIds.add(d.id);
      if (!/^[a-z][a-z0-9-]*\.json$/.test(d.file || '') || filenames.has(d.file)) throw new Error(`${d.id}: 학과 파일 이름이 올바르지 않거나 중복됩니다.`);
      filenames.add(d.file);
      for (const key of ['en', 'description', 'icon']) required(d[key], `${d.id} ${key}`);
      if (!/^#[\da-fA-F]{6}$/.test(d.color)) throw new Error(`${d.id}: 색상은 #4286cf 형식으로 입력해 주세요.`);
      const part = parts[i];
      if (part?.schemaVersion !== 1 || part.departmentId !== d.id || !Array.isArray(part.expressions)) throw new Error(`${d.file}: 학과 ID 또는 expressions 배열을 확인해 주세요.`);
      const days = new Set();
      if (d.active !== false && part.expressions.length < learning.quizOptionCount) throw new Error(`${d.file}: 퀴즈 보기 수만큼 표현이 필요합니다.`);
      part.expressions.forEach(e => {
        required(e.id, `${d.file} 표현 ID`);
        if (ids.has(e.id)) throw new Error(`중복 표현 ID: ${e.id}`);
        ids.add(e.id);
        if (e.departmentId !== d.id) throw new Error(`${e.id}: departmentId는 ${d.id}이어야 합니다.`);
        if (!Number.isInteger(e.day) || e.day < 1 || days.has(e.day)) throw new Error(`${d.file}: 학습 순서(day)가 중복되거나 올바르지 않습니다.`);
        days.add(e.day);
        for (const key of ['text', 'meaning', 'tip', 'reply', 'replyKo']) required(e[key], `${e.id} ${key}`);
        if (!Array.isArray(e.similar) || e.similar.length < 2 || e.similar.length > 3) throw new Error(`${e.id}: 유사 표현을 2~3개 입력해 주세요.`);
        e.similar.forEach(s => required(s, `${e.id} 유사 표현`));
      });
      if (d.active !== false) {
        if (new Set(part.expressions.map(e => e.meaning)).size < learning.quizOptionCount) throw new Error(`${d.file}: 서로 다른 뜻이 최소 ${learning.quizOptionCount}개 필요합니다.`);
      }

      expressions.push(...part.expressions.slice().sort((a,b) => a.day-b.day));
    });

    if (!departments.length) throw new Error('표시할 학과를 하나 이상 활성화해 주세요.');

  async function load(baseURL) {

      let response;
      try {response = await fetch(url, {cache:'no-store'});} catch {throw new Error(`${name}: 파일을 불러올 수 없습니다.`);}

    }

    const common = await json(commonURL);

      return json(new URL(d.file, commonURL));
    }));
    return assemble(common, parts);
  }
  globalThis.SmalltalkData = Object.freeze({assemble, load});
})();

function render(){const d=current();if(!d)state.department=null;document.querySelector('#app').innerHTML=`${storageError?'<div class="storage-error" role="alert">이 브라우저에서 기록을 저장할 수 없어요. 저장소 사용을 허용해 주세요.</div>':''}<div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">✦</div><div><strong>${esc(catalog.app.shortTitle)}</strong><small>${esc(catalog.app.tagline)}</small></div></div><nav class="nav" aria-label="메인 메뉴">${nav()}</nav><div class="sidebar-note"><b>작은 한마디의 힘 🌱</b>하루 한 문장씩,<br>나의 가능성이 자라는 시간.</div></aside><main class="main"><header class="topbar"><div class="crumb">${esc(catalog.app.title)} <span class="muted"> / ${!d?'시작하기':({study:'오늘의 학습',quiz:'오늘의 퀴즈',history:'학습기록',settings:'설정'})[view]}</span></div><div class="profile"><span class="muted">${d?esc(d.name)+' 클래스':'나의 첫 영어 습관'}</span><span class="avatar">☺</span></div></header><div class="content">${!d?onboarding():view==='study'?study():view==='quiz'?quiz():view==='history'?history():settings()}<div class="footer">${esc(catalog.app.footer)}</div></div></main><nav class="mobile-nav" aria-label="하단 메뉴">${nav()}</nav></div>`;bind();}
function onboarding(){return `<div class="page-head"><div><div class="eyebrow">A LITTLE EVERY DAY</div><h1 style="margin-top:8px">작은 대화로 여는, 나의 내일</h1><p>내 전공과 만나는 영어. 하루 한 문장부터 시작해요.</p></div><span class="date">나의 첫 번째 스몰토크</span></div><section class="hero"><div><span class="eyebrow">HELLO, NEW POSSIBILITIES</span><h2>영어로 건네는 한마디,<br>자신감의 시작이 돼요.</h2><p>처음이라도 괜찮아요. 우리 함께 연습해요.</p></div><div class="hero-art" aria-hidden="true"><div class="star">✧</div><div class="bubble">Hello, there! 👋</div><div class="bubble second">You can do it.</div><div class="plant">✦</div></div></section><div class="section-title"><h2>어떤 전공을 배우고 있나요?</h2><span>설정에서 언제든 변경할 수 있어요</span></div><div class="majors">${catalog.departments.map(d=>`<button class="major ${picked===d.id?'selected':''}" data-pick="${esc(d.id)}" aria-pressed="${picked===d.id}" style="--c:${d.color}"><span class="check">${picked===d.id?'●':'○'}</span><span class="major-icon">${esc(d.icon)}</span><h3>${esc(d.name)}</h3><small>${esc(d.en)}</small><p>${esc(d.description)}</p></button>`).join('')}</div><div class="start-row"><p class="muted tiny">✓ 하루 한 문장 &nbsp; ✓ 전공별 실무 표현 &nbsp; ✓ 나만의 학습기록</p><button class="primary" id="start" ${!picked?'disabled':''}>나의 스몰토크 시작하기 <span>→</span></button></div><div class="how">${[['01','내 전공으로 시작','일터에서 바로 쓸 수 있는 표현을 만나요.'],['02','하루 한 문장 연습','듣고, 따라 하고, 대화에 적용해요.'],['03','퀴즈로 자신감 더하기','정답을 확인하고 나의 성장을 기록해요.']].map(([n,t,p])=>`<div class="how-item"><span class="num">${n}</span><div><h3>${t}</h3><p>${p}</p></div></div>`).join('')}</div>`;}
function head(title,sub){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><span class="date">${new Intl.DateTimeFormat('ko-KR',{timeZone:catalog?.learning?.timezone||'Asia/Seoul',month:'long',day:'numeric',weekday:'long'}).format(new Date())}</span></div>`;}
function aside(){const n=records().length,total=catalog.expressions.filter(e=>e.departmentId===state.department).length;return `<aside class="aside"><div class="card"><h3>차곡차곡, 나의 성장</h3><p class="muted tiny" style="margin-top:5px">${esc(current().name)} 영어 챌린지</p><div class="progress-ring" style="--progress:${n/total*100}%"><div><strong>${n}<span style="font-size:15px;color:#bbb"> / ${total}</span></strong><small>완료한 표현</small></div></div><div class="progress-label"><span>나의 학습 진도</span><b>${Math.round(n/total*100)}%</b></div><div class="progress-line"><div style="width:${n/total*100}%"></div></div></div><div class="card motivation"><div class="eyebrow" style="color:#6a9a85">A LITTLE ENCOURAGEMENT</div><h3 style="margin-top:12px">완벽하지 않아도 괜찮아요.</h3><p>오늘 배운 한 문장이<br>내일의 대화를 바꿔 줄 거예요. 🌿</p></div></aside>`;}
function sound(text){return `<button class="listen" data-speak="${esc(text)}" aria-label="영어 발음 듣기">${icon('sound')}</button>`;}
function blocked(){const a=state.daily[today()];return a&&a.departmentId!==state.department;}
function study(){const e=lesson(),daily=state.daily[today()],done=daily?.completed;return head('오늘도, 한 문장 더 가까이 👋','부담 없이 한마디. 오늘의 스몰토크를 시작해 볼까요?')+`<div class="grid"><div>${blocked()?`<div class="card empty"><div class="big">☀</div><h2>오늘의 표현은 이미 정해졌어요</h2><p style="margin:15px 0">하루에 한 개씩 차근차근 배워요.<br>다른 학과의 새 학습은 내일 시작할 수 있어요.</p><button class="primary" id="return-daily">오늘의 학과로 돌아가기 →</button></div>`:!e?`<div class="card empty"><div class="big">✦</div><h2>${catalog.expressions.filter(e=>e.departmentId===state.department).length}개의 표현을 모두 배웠어요!</h2><p>학습기록에서 자신 있게 복습해 보세요.</p></div>`:`<section class="card lesson"><div class="lesson-top"><span class="badge">DAY ${String(e.day).padStart(2,'0')} <span>· ${esc(current().name)}</span></span><span class="tiny muted">${done?'✓ 오늘 학습 완료':'오늘의 표현'}</span></div><h2 class="english">${esc(e.text)}</h2><p class="meaning">${esc(e.meaning)}</p><div style="display:flex;align-items:center;gap:10px;margin-top:19px">${sound(e.text)}<span class="tiny muted">듣고, 천천히 따라 말해 보세요</span></div><div class="divider"></div><h3>이렇게도 말할 수 있어요</h3><p class="muted tiny" style="margin:5px 0 10px">같은 마음을 전하는 다양한 표현</p>${e.similar.map((s,i)=>`<div class="similar"><span><small>0${i+1}</small>${esc(s)}</span>${sound(s)}</div>`).join('')}<div class="tip">💡 <b>작은 영어 팁</b><br>${esc(e.tip)}</div><button class="primary full" id="learn">${done?'오늘의 퀴즈 다시 풀기':daily?'퀴즈로 확인하기':'학습했어요 · 퀴즈 풀기'} <span>→</span></button><p class="tiny muted" style="text-align:center;margin-top:11px">${done?'잘했어요! 다음 표현은 내일 열려요.':'퀴즈를 맞히면 오늘의 학습이 기록돼요.'}</p></section><section class="card" style="margin-top:22px"><div class="eyebrow">AT WORK</div><h3 style="margin-top:6px">일터에서는 이렇게 대화해요</h3><div class="dialogue"><small>나</small><p>${esc(e.text)}</p><small>동료 / 고객</small><p>${esc(e.reply)}</p><small>${esc(e.replyKo)}</small></div></section>`}</div>${aside()}</div>`;}
function quiz(){const e=lesson(),daily=state.daily[today()];if(!e||blocked()||!daily)return head('한 문장, 자신감 체크','오늘 배운 표현을 퀴즈로 확인해요.')+`<div class="card empty"><div class="big">▤</div><h2>오늘의 표현을 먼저 만나 볼까요?</h2><p style="margin:12px 0 22px">학습 화면에서 ‘학습했어요’를 누르면 퀴즈가 열려요.</p><button class="primary" data-nav="study">오늘의 학습 보러 가기 →</button></div>`;if(!options.length){options=[e,...catalog.expressions.filter(x=>x.departmentId===e.departmentId&&x.id!==e.id&&x.meaning!==e.meaning).sort(()=>Math.random()-.5).slice(0,catalog.learning.quizOptionCount-1)].sort(()=>Math.random()-.5);}const correct=answer===e.id;return head('한 문장, 자신감 체크','잘못 골라도 괜찮아요. 다시 생각하며 내 표현으로 만들어요.')+`<div class="grid"><section class="card lesson"><div class="lesson-top"><span class="badge">DAY ${String(e.day).padStart(2,'0')} · QUIZ</span><span class="muted tiny">1 / 1</span></div><p style="margin-top:27px;font-weight:600">다음 표현의 의미로 알맞은 것은 무엇일까요?</p><h2 class="english">${esc(e.text)}</h2><div style="margin-bottom:22px">${sound(e.text)}</div>${options.map((o,i)=>`<button class="quiz-option ${answer===o.id?(correct?'correct':'wrong'):''}" data-answer="${o.id}" ${answer?'disabled':''}><b>${i+1}</b>${esc(o.meaning)}</button>`).join('')}${answer?`<div class="feedback ${correct?'':'wrong'}" role="status"><b>${correct?'✓ 정답이에요! 오늘도 한 걸음 자랐어요.':'조금만 더 생각해 볼까요?'}</b><p class="tiny" style="margin-top:6px">${correct?esc(e.meaning):'영어 표현의 동작과 의도를 차근차근 확인해 보세요.'}</p></div><button class="primary full" style="margin-top:19px" id="${correct?'to-history':'retry'}">${correct?'학습기록 확인하기':'다시 도전하기'} →</button>`:''}</section>${aside()}</div>`;}
function history(){const rows=records().slice().reverse(),attempts=rows.reduce((s,r)=>s+r.attempts,0),n=rows.length;let streak=0,cursor=new Date(today()+'T12:00:00Z');const allDays=new Set(state.history.map(h=>h.date));if(!allDays.has(today()))cursor.setUTCDate(cursor.getUTCDate()-1);while(allDays.has(cursor.toISOString().slice(0,10))){streak++;cursor.setUTCDate(cursor.getUTCDate()-1);}const now=new Date(today()+'T12:00:00Z'),days=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()+1,0)).getUTCDate(),prefix=today().slice(0,7);return head('작은 대화가 쌓인 기록','매일의 한 문장이 나의 자신감이 되고 있어요.')+`<div class="stats">${[['완료한 표현',n+'개'],['연속 학습 · 전체',streak+'일'],['첫 도전 정답률',n?Math.round(rows.filter(r=>r.attempts===1).length/n*100)+'%':'—']].map(([t,v])=>`<div class="card"><span class="muted tiny">${t}</span><strong>${v}</strong></div>`).join('')}</div><div class="grid"><section class="card"><div class="section-title" style="margin-top:0"><h2>내가 배운 표현</h2><span>${esc(current().name)} · ${n}개</span></div>${rows.length?rows.map(r=>{const e=catalog.expressions.find(e=>e.id===r.expressionId);return `<div class="record"><span>✓</span><div style="flex:1"><small>${r.date} · DAY ${e?.day||''}</small><p>${esc(e?.text||'삭제된 표현')}</p><small>${esc(e?.meaning||'')}</small></div>${e?sound(e.text):''}</div>`}).join(''):`<div class="empty"><div class="big">♧</div><h3>아직은 비어 있는, 가능성 가득한 기록</h3><p style="margin:12px 0 20px">오늘의 첫 표현을 배우고 기록을 남겨 보세요.</p><button class="primary" data-nav="study">첫 문장 만나기 →</button></div>`}</section><aside class="aside"><div class="card"><h3>${now.getUTCMonth()+1}월의 영어 습관</h3><p class="tiny muted">전체 학과의 완료한 날을 표시해요.</p><div class="calendar">${Array.from({length:new Date(prefix+'-01T12:00:00Z').getUTCDay()},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>{const dt=prefix+'-'+String(i+1).padStart(2,'0');return `<span title="${dt}" class="day ${allDays.has(dt)?'done':''} ${dt===today()?'today':''}">${i+1}</span>`}).join('')}</div><span class="badge">✓ 학습 완료</span></div><div class="card motivation"><h3>어제보다 한 문장 더</h3><p>성장은 속도보다 꾸준함이에요.<br>나만의 속도로 함께 가요.</p></div></aside></div>`;}
function settings(){return head('나에게 맞는 스몰토크','배우고 싶은 전공과 학습 환경을 설정해요.')+`<section class="card"><h2>학습 설정</h2><div class="settings-row"><div><h3>나의 전공</h3><p>전공을 바꿔도 기존 학습기록은 유지돼요.</p></div><select id="department" aria-label="학과 변경">${catalog.departments.map(d=>`<option value="${d.id}" ${state.department===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div class="settings-row"><div><h3>발음 재생 속도</h3><p>편안한 속도로 듣고 따라 해 보세요.</p></div><select id="speed" aria-label="발음 재생 속도">${[[.7,'천천히'],[.85,'기본'],[1,'자연스럽게']].map(([v,t])=>`<option value="${v}" ${state.speed===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="settings-row"><div><h3>학습기록 내보내기</h3><p>나의 기록을 JSON 파일로 저장해요.</p></div><button class="secondary" id="export">내보내기 ↗</button></div><div class="settings-row"><div><h3>학습기록 초기화</h3><p>이 기기의 모든 학과 기록을 삭제해요.</p></div><button class="secondary" id="reset" style="color:#b06f7d">초기화</button></div><p class="notice">학과 선택과 학습기록은 현재 브라우저에 저장돼요. 다른 기기와 자동으로 동기화되지 않으며, 브라우저 데이터를 지우면 기록도 삭제돼요.<br>하루의 기준은 ${esc(catalog.learning.timezone)}의 자정이에요. 학습을 완료한 뒤에는 복습할 수 있고, 다음 표현은 다음 날 열려요.</p></section><section class="card" style="margin-top:22px"><div class="eyebrow">ABOUT SMALLTALK</div><h2 style="margin:9px 0">${esc(catalog.app.title)}</h2><p class="muted">특성화고 학생의 내일을 응원하는, 하루 한 문장 전공 영어.</p><p class="notice">학과와 공통 설정은 data/common.json에서, 영어 표현은 학과별 JSON 파일에서 관리합니다.</p></section>`;}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;answer=null;options=[];render();window.scrollTo(0,0)});document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{picked=b.dataset.pick;render()});document.querySelector('#start')?.addEventListener('click',()=>{state.department=picked;save();render();window.scrollTo(0,0)});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{if(!('speechSynthesis'in window))return toast('이 브라우저에서는 발음 듣기를 지원하지 않아요.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.speak);u.lang='en-US';u.rate=state.speed;u.onerror=()=>toast('발음을 재생하지 못했어요. 다시 시도해 주세요.');speechSynthesis.speak(u)});document.querySelector('#learn')?.addEventListener('click',()=>{read();if(blocked())return render();const e=lesson();if(!state.daily[today()])state.daily[today()]={departmentId:state.department,expressionId:e.id,attempts:0,completed:false};save();view='quiz';answer=null;options=[];render();window.scrollTo(0,0)});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{read();const daily=state.daily[today()],e=lesson();if(!daily||blocked()||!e){answer=null;options=[];return render();}answer=b.dataset.answer;if(!daily.completed){daily.attempts++;if(answer===e.id){daily.completed=true;state.history.push({departmentId:state.department,expressionId:e.id,date:today(),attempts:daily.attempts});}save();}render()});document.querySelector('#retry')?.addEventListener('click',()=>{answer=null;render()});document.querySelector('#to-history')?.addEventListener('click',()=>{view='history';render()});document.querySelector('#return-daily')?.addEventListener('click',()=>{state.department=state.daily[today()].departmentId;save();render()});document.querySelector('#department')?.addEventListener('change',e=>{state.department=e.target.value;save();options=[];answer=null;render();toast('학과를 변경했어요. 기존 기록도 그대로예요.')});document.querySelector('#speed')?.addEventListener('change',e=>{state.speed=Number(e.target.value);save();toast('발음 재생 속도를 변경했어요.')});document.querySelector('#export')?.addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='smalltalk-records-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});document.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('모든 학과의 학습기록을 삭제할까요? 이 작업은 되돌릴 수 없어요.')){state.history=[];state.daily={};save();render();toast('학습기록을 초기화했어요.')}});}
async function init(){
  try {
    if(location.protocol==='file:'||document.documentElement.dataset.preview==='standalone') {
      catalog=JSON.parse(document.getElementById('offline-catalog').textContent);
      if(catalog.schemaVersion!==1||!catalog.app)throw Error('node update-preview.mjs를 실행해 미리보기를 갱신해 주세요.');
    } else {
      catalog=await SmalltalkData.load(location.href);
    }
    KEY=catalog.app.storageKey;
    state.speed=catalog.learning.defaultSpeechRate;
    read();
    document.title=catalog.app.title;
    lastDay=today();
    render();
  } catch(error) {
    document.querySelector('#app').innerHTML='<div class="empty"><h2>학습 내용을 불러오지 못했어요</h2><p style="margin:15px">'+esc(error.message||'데이터 파일을 확인해 주세요.')+'</p><button class="primary" id="reload">다시 불러오기</button></div>';
    document.querySelector('#reload').onclick=init;
  }
}
window.addEventListener('storage',e=>{if(e.key===KEY){read();answer=null;options=[];if(catalog)render();}});let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();answer=null;options=[];if(catalog)render();}},15000);init();
</script></body></html>
